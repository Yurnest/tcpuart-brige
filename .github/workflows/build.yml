name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Publish to GitHub Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Try to delete the old "latest" release and tag so we can overwrite it
        gh release delete latest --cleanup-tag -y || true
        
        # Create a new "latest" prerelease with the APK attached
        gh release create latest app/build/outputs/apk/debug/app-debug.apk \
          --title "Latest Build" \
          --notes "Automated build from the latest commit." \
          --prerelease
